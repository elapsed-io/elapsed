# Runs on every push and pull request (plan, Release 1 round 1):
# type check, lint, unit tests, contrast check, build, size budget, and the
# end-to-end tests that load the production build under the real CSP.
#
# Actions are pinned to full commit SHAs (supply chain); the comment after
# each SHA names the release it was taken from.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test, contrast, build, size
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Audit for known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Contrast check
        run: npm run check:contrast
      - name: Build
        run: npm run build
      - name: Size budget
        run: npm run check:size

  e2e:
    name: end-to-end (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Install ${{ matrix.browser }} for Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end tests
        run: npm run test:e2e -w @stopwatch/web -- --project=${{ matrix.browser }}
      # A failed pixel comparison keeps both images (e2e/pixels.ts); they are kept for a week to be looked at.
      - name: Keep the failed tests' images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}
          path: packages/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
